<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">اجرای کد</title>
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Vazirmatn', sans-serif;
            background: #000;
            overflow: auto;
        }
        #output-frame {
            width: 100%;
            height: 100vh;
            border: none;
            background: #fff;
        }
        #fallback {
            color: #0f0;
            background: #000;
            padding: 20px;
            font-family: monospace;
            min-height: 100vh;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 14px;
            line-height: 1.6;
        }
        #error-msg {
            color: #f44;
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="error-msg" style="display:none;"></div>
    <iframe id="output-frame" style="display:none;"></iframe>
    <pre id="fallback" style="display:none;"></pre>

    <script>
        // ==========================================
        // EXECUTION ENGINE (SIMPLE - JUST SHOW RESULT)
        // ==========================================
        async function executeCode() {
            const urlParams = new URLSearchParams(location.search);
            const encodedCode = urlParams.get('code');
            const shareId = urlParams.get('share');
            const codeType = urlParams.get('type') || 'html';
            const codeName = urlParams.get('name') || 'project';
            
            let codeData = null;
            
            // Try share ID
            if (shareId) {
                const tempKey = 'codeorbit_shared_' + shareId;
                const stored = localStorage.getItem(tempKey);
                if (stored) {
                    try { codeData = JSON.parse(stored); } catch(e) {}
                }
            }
            
            // Try encoded URL
            if (!codeData && encodedCode) {
                try {
                    const decoded = LZString.decompressFromEncodedURIComponent(encodedCode);
                    if (decoded) {
                        codeData = {
                            name: decodeURIComponent(codeName),
                            content: decoded,
                            language: codeType.toUpperCase()
                        };
                    }
                } catch(e) {}
            }
            
            // Fallback
            if (!codeData) {
                try {
                    codeData = JSON.parse(sessionStorage.getItem('codeorbit_run_code') || 'null');
                } catch(e) {}
            }

            if (!codeData || !codeData.content) {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').textContent = '❌ کدی برای اجرا پیدا نشد';
                return;
            }

            // SET PAGE TITLE
            document.title = codeData.name || 'اجرای کد';
            
            const code = codeData.content;
            const ext = (codeData.name || '').split('.').pop()?.toLowerCase() || codeType;

            if (ext === 'html' || ext === 'htm') {
                // Show HTML in iframe
                document.getElementById('output-frame').style.display = 'block';
                document.getElementById('output-frame').srcdoc = code;
            } 
            else if (ext === 'js') {
                // Execute JavaScript and show output
                document.getElementById('fallback').style.display = 'block';
                const fallback = document.getElementById('fallback');
                fallback.textContent = '';
                
                const origLog = console.log;
                console.log = (...args) => {
                    fallback.textContent += args.join(' ') + '\n';
                };
                
                try {
                    eval(code);
                } catch(e) {
                    fallback.textContent += 'Error: ' + e.message;
                }
                
                console.log = origLog;
            }
            else if (ext === 'py') {
                // Execute Python
                document.getElementById('fallback').style.display = 'block';
                const fallback = document.getElementById('fallback');
                fallback.textContent = '🐍 Loading Python...\n';
                
                try {
                    const pyodide = await loadPyodide();
                    fallback.textContent += 'Running...\n\n';
                    
                    pyodide.setStdout({
                        batched: (text) => {
                            fallback.textContent += text;
                        }
                    });
                    
                    await pyodide.runPythonAsync(code);
                    fallback.textContent += '\n\n✅ Done.';
                } catch(e) {
                    fallback.textContent += '\n❌ Error: ' + e.message;
                }
            }
            else {
                // Show source code
                document.getElementById('fallback').style.display = 'block';
                document.getElementById('fallback').textContent = code;
            }
        }

        executeCode();
    </script>
</body>
</html>
