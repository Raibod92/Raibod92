<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجرای کد</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='g1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' style='stop-color:%2300ff41;stop-opacity:1'/><stop offset='50%25' style='stop-color:%2300cc33'/><stop offset='100%25' style='stop-color:%23006600'/></linearGradient><filter id='glow'><feGaussianBlur stdDeviation='6'/><feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><rect width='512' height='512' rx='120' fill='%23050505'/><rect width='512' height='512' rx='120' fill='none' stroke='%2300ff41' stroke-width='3' opacity='0.3'/><circle cx='256' cy='240' r='110' fill='url(%23g1)' filter='url(%23glow)' opacity='0.9'/><circle cx='256' cy='240' r='80' fill='%23050505' stroke='%2300ff41' stroke-width='2' opacity='0.5'/><ellipse cx='256' cy='240' rx='170' ry='35' fill='none' stroke='%2300ff41' stroke-width='3' transform='rotate(-25,256,240)' opacity='0.6'/><ellipse cx='256' cy='240' rx='140' ry='25' fill='none' stroke='%2300ff41' stroke-width='2' transform='rotate(55,256,240)' opacity='0.4'/><circle cx='170' cy='170' r='5' fill='%23fff' filter='url(%23glow)'/><circle cx='340' cy='310' r='4' fill='%23fff' opacity='0.7'/></svg>">
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #000; overflow: auto; }
        #output-frame { width: 100%; height: 100vh; border: none; background: #fff; display: none; }
        #text-display { color: #e0ffe0; background: #0a0a0a; padding: 30px; min-height: 100vh; white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 2; display: none; font-family: 'Vazirmatn', sans-serif; }
        #code-display { color: #0f0; background: #000; padding: 20px; font-family: 'JetBrains Mono', monospace; min-height: 100vh; white-space: pre-wrap; word-break: break-all; font-size: 14px; line-height: 1.6; display: none; }
        #error-msg { color: #f44; text-align: center; padding: 50px; font-size: 18px; display: none; }
        #loading { color: #0f0; text-align: center; padding: 50px; font-size: 18px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="loading">⏳ در حال بارگذاری...</div>
    <div id="error-msg"></div>
    <iframe id="output-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    <div id="text-display"></div>
    <pre id="code-display"></pre>

    <script>
        // ==========================================
        // OPFS READER
        // ==========================================
        async function getFromOPFS(key) {
            try {
                var root = await navigator.storage.getDirectory();
                var handle = await root.getFileHandle(key + '.json');
                var file = await handle.getFile();
                var text = await file.text();
                return JSON.parse(text);
            } catch(e) {
                return null;
            }
        }

        // ==========================================
        // INDEXEDDB READER
        // ==========================================
        function getFromDB(key) {
            return new Promise(function(resolve) {
                var req = indexedDB.open('CodeOrbitDB', 1);
                req.onsuccess = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) { db.close(); resolve(null); return; }
                    var tx = db.transaction('files', 'readonly');
                    var store = tx.objectStore('files');
                    var getReq = store.get(key);
                    getReq.onsuccess = function() {
                        if (getReq.result && getReq.result.data) {
                            resolve(getReq.result.data);
                        } else {
                            resolve(null);
                        }
                    };
                    getReq.onerror = function() { resolve(null); };
                    tx.oncomplete = function() { db.close(); };
                };
                req.onerror = function() { resolve(null); };
            });
        }

        // ==========================================
        // FORMAT SIZE
        // ==========================================
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        // ==========================================
        // MAIN EXECUTION
        // ==========================================
        async function main() {
            var params = new URLSearchParams(location.search);
            var shareId = params.get('share');
            var encodedCode = params.get('code');
            var codeType = params.get('type') || 'html';
            var codeName = params.get('name') || 'project';
            var codeData = null;

            // 1. TRY OPFS (فضای نامحدود)
            if (shareId) {
                var dbKey = 'codeorbit_shared_' + shareId;
                codeData = await getFromOPFS(dbKey);
            }

            // 2. TRY INDEXEDDB (Fallback)
            if (!codeData && shareId) {
                var dbKey = 'codeorbit_shared_' + shareId;
                codeData = await getFromDB(dbKey);
            }

            // 3. TRY LOCALSTORAGE (Fallback)
            if (!codeData && shareId) {
                var dbKey = 'codeorbit_shared_' + shareId;
                var stored = localStorage.getItem(dbKey);
                if (stored) {
                    try {
                        codeData = JSON.parse(stored);
                        if (codeData && codeData.compressed) {
                            codeData.content = LZString.decompressFromUTF16(codeData.content);
                        }
                    } catch(e) {}
                }
            }

            // 4. TRY ENCODED URL (فایل‌های کوچک و یادداشت)
            if (!codeData && encodedCode) {
                try {
                    var decoded = LZString.decompressFromEncodedURIComponent(encodedCode);
                    if (decoded) {
                        codeData = {
                            name: decodeURIComponent(codeName),
                            content: decoded,
                            language: (codeType === 'note') ? 'NOTE' : codeType.toUpperCase()
                        };
                    }
                } catch(e) {}
            }

            // 5. FALLBACK: sessionStorage
            if (!codeData) {
                try {
                    codeData = JSON.parse(sessionStorage.getItem('codeorbit_run_code') || 'null');
                } catch(e) {}
            }

            // CHECK RESULT
            if (!codeData || !codeData.content) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').textContent = '❌ کدی برای اجرا پیدا نشد';
                return;
            }

            // SUCCESS
            document.getElementById('loading').style.display = 'none';
            document.title = (codeData.name && codeData.name !== 'project') ? codeData.name : 'اجرای کد';

            var code = codeData.content;
            var lang = (codeData.language || '').toUpperCase();
            var ext = (codeData.name || '').split('.').pop()?.toLowerCase() || '';

            // EXECUTE BASED ON TYPE
            if (lang === 'NOTE' || codeType === 'note') {
                // Show as styled text
                var textDisplay = document.getElementById('text-display');
                textDisplay.style.display = 'block';
                textDisplay.textContent = code;
            } else if (ext === 'html' || ext === 'htm' || lang === 'HTML') {
                // Show in iframe
                var iframe = document.getElementById('output-frame');
                iframe.style.display = 'block';
                iframe.srcdoc = code;
            } else if (ext === 'js' || lang === 'JAVASCRIPT' || lang === 'JS') {
                // Execute JavaScript
                var codeDisplay = document.getElementById('code-display');
                codeDisplay.style.display = 'block';
                codeDisplay.textContent = '';
                var origLog = console.log;
                console.log = function() {
                    var args = Array.prototype.slice.call(arguments);
                    codeDisplay.textContent += args.join(' ') + '\n';
                };
                try {
                    eval(code);
                } catch(e) {
                    codeDisplay.textContent += '\n❌ Error: ' + e.message;
                }
                console.log = origLog;
            } else if (ext === 'py' || lang === 'PYTHON' || lang === 'PY') {
                // Execute Python
                var codeDisplay = document.getElementById('code-display');
                codeDisplay.style.display = 'block';
                codeDisplay.textContent = '🐍 Loading Python...\n';
                try {
                    var pyodide = await loadPyodide();
                    codeDisplay.textContent += '▶ Running...\n\n';
                    pyodide.setStdout({
                        batched: function(text) {
                            codeDisplay.textContent += text;
                        }
                    });
                    await pyodide.runPythonAsync(code);
                    codeDisplay.textContent += '\n\n✅ Execution completed.';
                } catch(e) {
                    codeDisplay.textContent += '\n\n❌ Error: ' + e.message;
                }
            } else {
                // Display source code
                var codeDisplay = document.getElementById('code-display');
                codeDisplay.style.display = 'block';
                codeDisplay.textContent = code;
            }
        }

        // START
        main();
    </script>
</body>
</html>
