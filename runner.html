<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- CodeOrbit Favicon -->

 fill='%23ffffff' opacity='0.6'/><polygon points='256,100 280,160 340,170 290,210 300,270 256,240 212,270 222,210 172,170 232,160' fill='%23ffffff' filter='url(%23glow)' opacity='0.4' transform='scale(0.3) translate(600,600)'/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اجرای کد</title>
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #000; overflow: auto; }
        #output-frame { width: 100%; height: 100vh; border: none; background: #fff; display: none; }
        #fallback { color: #0f0; background: #000; padding: 20px; font-family: monospace; min-height: 100vh; white-space: pre-wrap; word-break: break-all; font-size: 14px; line-height: 1.6; display: none; }
        #error-msg { color: #f44; text-align: center; padding: 50px; font-size: 18px; display: none; }
        #loading { color: #0f0; text-align: center; padding: 50px; font-size: 18px; font-family: monospace; }
    </style>
</head>
<body>
    <div id="loading">⏳ در حال بارگذاری...</div>
    <div id="error-msg"></div>
    <iframe id="output-frame"></iframe>
    <pre id="fallback"></pre>

    <script>
        // ==========================================
        // INDEXEDDB
        // ==========================================
        function getFromDB(key) {
            return new Promise(function(resolve) {
                var req = indexedDB.open('CodeOrbitDB', 1);
                req.onsuccess = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('files')) { db.close(); resolve(null); return; }
                    var tx = db.transaction('files', 'readonly');
                    var store = tx.objectStore('files');
                    var getReq = store.get(key);
                    getReq.onsuccess = function() {
                        if (getReq.result && getReq.result.data) {
                            resolve(getReq.result.data);
                        } else {
                            resolve(null);
                        }
                    };
                    getReq.onerror = function() { resolve(null); };
                    tx.oncomplete = function() { db.close(); };
                };
                req.onerror = function() { resolve(null); };
            });
        }

        // ==========================================
        // MAIN
        // ==========================================
        async function main() {
            var params = new URLSearchParams(location.search);
            var shareId = params.get('share');
            var encodedCode = params.get('code');
            var codeType = params.get('type') || 'html';
            var codeName = params.get('name') || 'project';
            var codeData = null;
            
            // 1. Try IndexedDB
            if (shareId) {
                var dbKey = 'codeorbit_shared_' + shareId;
                codeData = await getFromDB(dbKey);
                
                // 2. Fallback: localStorage
                if (!codeData) {
                    var stored = localStorage.getItem(dbKey);
                    if (stored) {
                        try {
                            codeData = JSON.parse(stored);
                            if (codeData && codeData.compressed) {
                                codeData.content = LZString.decompressFromUTF16(codeData.content);
                            }
                        } catch(e) {}
                    }
                }
            }
            
            // 3. Try encoded URL
            if (!codeData && encodedCode) {
                try {
                    var decoded = LZString.decompressFromEncodedURIComponent(encodedCode);
                    if (decoded) {
                        codeData = {
                            name: decodeURIComponent(codeName),
                            content: decoded,
                            language: codeType.toUpperCase()
                        };
                    }
                } catch(e) {}
            }
            
            // 4. sessionStorage fallback
            if (!codeData) {
                try {
                    codeData = JSON.parse(sessionStorage.getItem('codeorbit_run_code') || 'null');
                } catch(e) {}
            }
            
            // Check result
            if (!codeData || !codeData.content) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('error-msg').textContent = '❌ کدی برای اجرا پیدا نشد';
                return;
            }
            
            // Success!
            document.getElementById('loading').style.display = 'none';
            document.title = codeData.name || 'اجرای کد';
            
            var code = codeData.content;
            var ext = (codeData.name || '').split('.').pop()?.toLowerCase() || 'html';
            
            if (ext === 'html' || ext === 'htm') {
                var iframe = document.getElementById('output-frame');
                iframe.style.display = 'block';
                iframe.srcdoc = code;
            } else if (ext === 'js') {
                var fb = document.getElementById('fallback');
                fb.style.display = 'block';
                fb.textContent = '';
                var origLog = console.log;
                console.log = function() {
                    fb.textContent += Array.prototype.join.call(arguments, ' ') + '\n';
                };
                try { eval(code); } catch(e) { fb.textContent += 'Error: ' + e.message; }
                console.log = origLog;
            } else if (ext === 'py') {
                var fb = document.getElementById('fallback');
                fb.style.display = 'block';
                fb.textContent = '🐍 Loading Python...\n';
                try {
                    var pyodide = await loadPyodide();
                    fb.textContent += 'Running...\n\n';
                    pyodide.setStdout({ batched: function(text) { fb.textContent += text; } });
                    await pyodide.runPythonAsync(code);
                    fb.textContent += '\n\n✅ Done.';
                } catch(e) { fb.textContent += '\n❌ Error: ' + e.message; }
            } else {
                var fb = document.getElementById('fallback');
                fb.style.display = 'block';
                fb.textContent = code;
            }
        }
        
        main();
    </script>
</body>
</html>
